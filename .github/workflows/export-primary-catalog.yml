name: Export primary Taiba catalog (read only)

on:
  push:
    branches: [task/export-catalog-2026-11-22]

permissions:
  contents: read
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export catalog tables from primary Supabase
        env:
          SUPABASE_URL: https://hgqwpykeazuzceeiumjg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Repository secret SUPABASE_SERVICE_ROLE_KEY (or SUPABASE_SECRET_KEY) is not configured. No data was accessed."
            exit 1
          fi
          mkdir -p export
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const base = process.env.SUPABASE_URL.replace(/\\/$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const tenantId = 'e6771fd7-35b9-44af-b908-bd17d162d981';
          const tables = [
            ['master_catalog_tests', 'id.asc', null],
            ['master_catalog_parameters', 'id.asc', null],
            ['test_parameters', 'id.asc', tenantId]
          ];
          for (const [table, order, tenant] of tables) {
            const params = new URLSearchParams({ select: '*', order });
            if (tenant) params.set('tenant_id', 'eq.' + tenant);
            const response = await fetch(base + '/rest/v1/' + table + '?' + params, {
              headers: { apikey: key, Authorization: 'Bearer ' + key, Accept: 'application/json' }
            });
            if (!response.ok) throw new Error(table + ' export failed with HTTP ' + response.status);
            const rows = await response.json();
            if (!Array.isArray(rows)) throw new Error(table + ' returned an unexpected response');
            await writeFile('export/' + table + '.json', JSON.stringify(rows, null, 2), 'utf8');
            console.log(table + ': ' + rows.length + ' rows exported');
          }
          NODE
          cat > export/README.txt <<'TXT'
          Read-only export from the primary Taiba Smart Lab Supabase database.
          No database rows were modified.
          test_parameters is scoped to the Taiba tenant ID used by this project.
          JSON files preserve every source column and nested JSON value.
          TXT
      - name: Upload private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: taiba-catalog-export-2026-11-22
          path: export/
          if-no-files-found: error
          retention-days: 1
