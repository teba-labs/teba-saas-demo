name: Static regression tests

on:
  workflow_dispatch:
  push:
    branches:
      - cloud-hardening-2026-11-18
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static regression tests
        run: node --test tests/static/*.test.mjs
