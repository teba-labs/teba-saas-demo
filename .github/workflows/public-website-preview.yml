name: Taiba GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: taiba-public-site-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          for directory in app assets config core dashboard modules offline portal website; do
            cp -R "$directory" _site/
          done
          cp service-worker.js _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=website/index.html?lab=teba-labs"><title>معامل طيبة</title></head>
          <body><p><a href="website/index.html?lab=teba-labs">فتح موقع معامل طيبة</a></p></body>
          </html>
          HTML
          test -s _site/website/index.html
          test -s _site/core/supabase-client.js
          test -s _site/config/environment.js
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
