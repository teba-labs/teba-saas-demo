name: Windows Desktop Installer

on:
  push:
    branches:
      - feature/windows-electron-desktop-2026-11-28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Electron source
        run: npm run check:electron
      - name: Run desktop contract tests
        run: npm test
      - name: Build Windows installer
        run: npm run build:icons; npx electron-builder --win nsis --x64 --publish never
      - name: Install and launch desktop smoke test
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'dist\\Taiba-Smart-Lab-Setup-1.0.0-x64.exe').Path
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($install.ExitCode)" }
          $appExe = Join-Path $env:LOCALAPPDATA 'Programs\\Taiba Smart Lab\\Taiba Smart Lab.exe'
          if (-not (Test-Path $appExe)) { throw "Installed desktop executable not found at $appExe" }
          $desktop = Start-Process -FilePath $appExe -ArgumentList '--remote-debugging-port=9222' -PassThru
          $deadline = (Get-Date).AddSeconds(45)
          $page = $null
          while ((Get-Date) -lt $deadline -and -not $page) {
            if ($desktop.HasExited) { throw "Taiba Smart Lab exited during startup (code $($desktop.ExitCode))" }
            try {
              $targets = Invoke-RestMethod -Uri 'http://127.0.0.1:9222/json/list' -TimeoutSec 2
              $page = $targets | Where-Object { $_.type -eq 'page' -and $_.url -eq 'taiba://app/app/index.html' } | Select-Object -First 1
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $page) { throw "Local renderer did not load taiba://app/app/index.html within 45 seconds" }
          if (-not $page.title -or $page.title -notmatch 'Taiba|طيبة') { throw "Unexpected desktop renderer title: $($page.title)" }
          if ($desktop.HasExited) { throw "Taiba Smart Lab exited after renderer load (code $($desktop.ExitCode))" }
          Stop-Process -Id $desktop.Id -Force
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: taiba-smart-lab-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
