name: Reconciliation branch Netlify preview

on:
  push:
    branches: [integration/reconciled-release-2026-11-20]
    paths-ignore:
      - "docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taiba-reconciled-preview
  cancel-in-progress: true

jobs:
  draft-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Check out exact reconciliation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check preview credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$NETLIFY_AUTH_TOKEN" && -n "$NETLIFY_SITE_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Preview skipped: Netlify credentials are not configured."
          fi
      - name: Set up Node.js
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Build browser-only deployment
        if: steps.credentials.outputs.available == 'true'
        run: bash scripts/build-netlify.sh
      - name: Publish non-production draft preview
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes netlify-cli@27.20.0 deploy --dir=dist --no-build --alias=taiba-reconciled-preview --json > netlify-preview.json
          cat netlify-preview.json
