name: Static source tests

on:
  push:
    branches:
      - main
      - 'feature-completion/**'
  pull_request:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static contract tests
        run: node --test tests/static/*.test.mjs
