name: Static contract tests

on:
  push:
    branches:
      - "feature-completion/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static contract tests
        run: node --test tests/static/*.test.mjs
      - name: Check JavaScript module syntax
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -r -n1 node --experimental-default-type=module --check
