name: Static contract tests

on:
  push:
    branches:
      - "feature-completion/**"
      - "integration/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static contract tests
        run: node --test tests/static/*.test.mjs tests/unit/*.test.mjs
      - name: Check JavaScript module syntax
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -r -n1 node --experimental-default-type=module --check

      - name: Package the complete tracked development source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          archive="taiba-smart-lab-development-$(git rev-parse --short=12 HEAD).zip"
          git archive --format=zip --output="$archive" HEAD
          test -s "$archive"
          sha256sum "$archive" | tee "$archive.sha256"

      - name: Upload downloadable development backup
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: taiba-smart-lab-development-source
          path: |
            taiba-smart-lab-development-*.zip
            taiba-smart-lab-development-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
