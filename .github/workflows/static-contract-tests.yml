name: Static contract tests

on:
  pull_request:
    branches: [main]
  pull_request:
    branches: [main, integration/reconciled-release-2026-11-20]
  push:
    branches: [main, feature/reception-complete-workflow-2026-11-20, integration/reconciled-release-2026-11-20]

permissions:
  contents: read

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check all tracked JavaScript modules
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -r -n1 node --experimental-default-type=module --check
      - name: Build browser-only deployment artifact
        run: bash scripts/build-netlify.sh
      - name: Run all static and unit regression tests
        run: node --test tests/static/*.test.mjs tests/unit/*.test.mjs
