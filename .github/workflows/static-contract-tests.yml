name: Static contract tests

on:
  pull_request:
    branches: [main, integration/reconciled-release-2026-11-20, integration/unified-test-2026-11-19, feature/one-cycle-full-redesign-2026-11-22, feature/tenant-test-approval-workflow]
  push:
    branches: [main, feature/reception-complete-workflow-2026-11-20, integration/reconciled-release-2026-11-20, integration/unified-test-2026-11-19, feature/experience-unification-2026-11-21, feature/ui-polish-full-system-2026-11-21, feature/platform-admin-patient-portal-2026-11-21, feature/offline-entitlement-completion-2026-11-21, feature/full-ui-cycle-2026-11-22, fix/accountant-timeless-prices-2026-11-22, feature/tenant-test-approval-workflow]

permissions:
  contents: read

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check all tracked JavaScript modules
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -r -n1 node --experimental-default-type=module --check
      - name: Build browser-only deployment artifact
        run: bash scripts/build-netlify.sh
      - name: Run all static and unit regression tests
        run: node --test tests/static/*.test.mjs tests/unit/*.test.mjs
      - name: Package exact source after all checks pass
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          archive="taiba-smart-lab-reconciled-$(git rev-parse --short=12 HEAD).zip"
          git archive --format=zip --output="$archive" HEAD
          test -s "$archive"
          sha256sum "$archive" | tee "$archive.sha256"
      - name: Upload source archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: taiba-smart-lab-reconciled-source
          path: |
            taiba-smart-lab-reconciled-*.zip
            taiba-smart-lab-reconciled-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
